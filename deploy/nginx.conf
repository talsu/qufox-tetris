# Serving rules for the static frontend image (Dockerfile.web).
# Mirrors the pre-k3s NAS nginx block: SPA fallback, /build assets 404 on miss.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /build {
        try_files $uri $uri/ =404;
    }
}
