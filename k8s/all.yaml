# tetris.qufox.com — 정적 SPA. 파일은 NAS NFS(ro), 서빙은 nginx 파드.
# NAS nginx의 server 블록(root /etc/qufox-tetris + SPA fallback)을 재현한다.
# /server(멀티플레이 socket.io)는 NAS 호스트에서 도는 node 프로세스(:3031)로
# 라우팅한다 — 셀렉터 없는 Service + EndpointSlice (qufox의 nas-minio 패턴).
apiVersion: v1
kind: Namespace
metadata:
  name: qufox-tetris
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qufox-tetris-static
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.0.71
    path: /volume1/cluster-volume/qufox-tetris
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qufox-tetris-static
  namespace: qufox-tetris
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: qufox-tetris-static
  resources:
    requests:
      storage: 1Gi
---
# NAS nginx 블록과 동일한 서빙 규칙 (SPA fallback + /build는 404)
apiVersion: v1
kind: ConfigMap
metadata:
  name: qufox-tetris-nginx
  namespace: qufox-tetris
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /build {
            try_files $uri $uri/ =404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qufox-tetris
  namespace: qufox-tetris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qufox-tetris
  template:
    metadata:
      labels:
        app: qufox-tetris
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: static
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 15
      volumes:
        - name: static
          persistentVolumeClaim:
            claimName: qufox-tetris-static
        - name: conf
          configMap:
            name: qufox-tetris-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: qufox-tetris
  namespace: qufox-tetris
spec:
  selector:
    app: qufox-tetris
  ports:
    - port: 80
      targetPort: 80
---
# NAS 호스트 프로세스(node server/index.js, :3031)로 가는 외부 백엔드.
# 서버는 /server 프리픽스를 포함한 경로를 기대하므로 StripPrefix 없이 라우팅.
apiVersion: v1
kind: Service
metadata:
  name: nas-tetris-server
  namespace: qufox-tetris
spec:
  ports:
    - name: ws
      port: 3031
      targetPort: 3031
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nas-tetris-server-1
  namespace: qufox-tetris
  labels:
    kubernetes.io/service-name: nas-tetris-server
addressType: IPv4
endpoints:
  - addresses: ["192.168.0.71"]
ports:
  - name: ws
    port: 3031
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qufox-tetris
  namespace: qufox-tetris
spec:
  ingressClassName: traefik
  rules:
    - host: tetris.192.168.0.6.nip.io   # 내부 테스트용
      http:
        paths:
          - path: /server               # 멀티플레이 socket.io → NAS :3031
            pathType: Prefix
            backend:
              service:
                name: nas-tetris-server
                port:
                  number: 3031
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qufox-tetris
                port:
                  number: 80
    - host: tetris.qufox.com            # 컷오버 후 NAS nginx가 이리로 프록시
      http:
        paths:
          - path: /server
            pathType: Prefix
            backend:
              service:
                name: nas-tetris-server
                port:
                  number: 3031
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qufox-tetris
                port:
                  number: 80
