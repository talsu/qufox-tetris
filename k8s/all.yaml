# tetris.qufox.com — Pi k3s 클러스터 매니페스트.
#   web   : webpack 산출물을 구운 nginx 이미지 (Dockerfile.web)
#   server: 멀티플레이 socket.io 서버 (Dockerfile.server, 구 NAS pm2 프로세스)
# 이미지는 ghcr.io/talsu/qufox-tetris/{web,server} 비공개 패키지 — 배포는 GitOps
# (GitHub Actions .github/workflows/deploy.yml → ghcr push → k8s/ 태그 커밋 → Flux). TLS는 NAS nginx가 종료 후 파이 traefik으로 프록시.
# 전제: ns에 ghcr-pull imagePullSecret 필요 (qufox의 k8s/README.md 참조).
apiVersion: v1
kind: Namespace
metadata:
  name: qufox-tetris
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qufox-tetris
  namespace: qufox-tetris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qufox-tetris
  template:
    metadata:
      labels:
        app: qufox-tetris
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/talsu/qufox-tetris/web:sha-93b585e   # CI(.github/workflows/deploy.yml)가 sha 태그로 교체 커밋 → Flux 롤아웃
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: qufox-tetris
  namespace: qufox-tetris
spec:
  selector:
    app: qufox-tetris
  ports:
    - port: 80
      targetPort: 80
---
# 멀티플레이 서버 — 게임 방 상태가 메모리에 있으므로 replicas는 반드시 1
# (스케일아웃하려면 socket.io redis adapter + 상태 공유가 먼저 필요).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qufox-tetris-server
  namespace: qufox-tetris
spec:
  replicas: 1
  strategy:
    type: Recreate          # 교체 배포 시 순간 이중 실행 방지(방 상태 분열 예방)
  selector:
    matchLabels:
      app: qufox-tetris-server
  template:
    metadata:
      labels:
        app: qufox-tetris-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: server
          image: ghcr.io/talsu/qufox-tetris/server:sha-93b585e
          ports:
            - containerPort: 3031
          env:
            - name: PORT
              value: "3031"
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /server/socket.io/?EIO=4&transport=polling
              port: 3031
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: qufox-tetris-server
  namespace: qufox-tetris
spec:
  selector:
    app: qufox-tetris-server
  ports:
    - port: 3031
      targetPort: 3031
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qufox-tetris
  namespace: qufox-tetris
spec:
  ingressClassName: traefik
  rules:
    - host: tetris.192.168.0.6.nip.io   # 내부 테스트용
      http:
        paths:
          - path: /server               # 멀티플레이 socket.io (프리픽스 유지)
            pathType: Prefix
            backend:
              service:
                name: qufox-tetris-server
                port:
                  number: 3031
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qufox-tetris
                port:
                  number: 80
    - host: tetris.qufox.com            # NAS nginx가 이리로 프록시
      http:
        paths:
          - path: /server
            pathType: Prefix
            backend:
              service:
                name: qufox-tetris-server
                port:
                  number: 3031
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qufox-tetris
                port:
                  number: 80
