# tetris.qufox.com — 정적 SPA. 파일은 NAS NFS(ro), 서빙은 nginx 파드.
# NAS nginx의 server 블록(root /etc/qufox-tetris + SPA fallback)을 재현한다.
# /server(멀티플레이 ws 프록시)는 대상 컨테이너가 NAS에도 없어(죽은 경로) 미이관.
apiVersion: v1
kind: Namespace
metadata:
  name: qufox-tetris
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qufox-tetris-static
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.0.71
    path: /volume1/cluster-volume/qufox-tetris
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qufox-tetris-static
  namespace: qufox-tetris
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: qufox-tetris-static
  resources:
    requests:
      storage: 1Gi
---
# NAS nginx 블록과 동일한 서빙 규칙 (SPA fallback + /build는 404)
apiVersion: v1
kind: ConfigMap
metadata:
  name: qufox-tetris-nginx
  namespace: qufox-tetris
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /build {
            try_files $uri $uri/ =404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qufox-tetris
  namespace: qufox-tetris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qufox-tetris
  template:
    metadata:
      labels:
        app: qufox-tetris
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: static
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 15
      volumes:
        - name: static
          persistentVolumeClaim:
            claimName: qufox-tetris-static
        - name: conf
          configMap:
            name: qufox-tetris-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: qufox-tetris
  namespace: qufox-tetris
spec:
  selector:
    app: qufox-tetris
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qufox-tetris
  namespace: qufox-tetris
spec:
  ingressClassName: traefik
  rules:
    - host: tetris.192.168.0.6.nip.io   # 내부 테스트용
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qufox-tetris
                port:
                  number: 80
    - host: tetris.qufox.com            # 컷오버 후 NAS nginx가 이리로 프록시
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qufox-tetris
                port:
                  number: 80
